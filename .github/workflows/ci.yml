name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Calibration mode (calibrate or triage-sim)'
        required: false
        type: choice
        options:
          - calibrate
          - triage-sim

env:
  PYTHONUNBUFFERED: "1"

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: |
          pytest tests -v --json-report --json-report-file=pytest-report.json

      - name: Triage on CI failure
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          python scripts/ci_triage.py --report-file=pytest-report.json

  calibrate:
    name: Calibrate Target Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run calibration protocol
        run: |
          python scripts/calibrate.py --mode=${{ github.event.inputs.mode || 'calibrate' }}
